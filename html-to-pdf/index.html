<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional PDF Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-area {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            background-color: #1e293b;
            color: #f8fafc;
            resize: none;
            outline: none;
            border: none;
        }

        .preview-container {
            background-color: #334155;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            transform-origin: top center;
            transition: transform 0.1s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #3b82f6;
            color: white;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 40px;
        }

        input,
        select,
        textarea {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #3b82f6;
            border-color: transparent;
        }
    </style>
</head>

<body>
    <header class="bg-slate-900 border-b border-slate-700 h-14 flex items-center justify-between px-4 shadow-md z-10">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-1.5 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white">PDF<span class="text-blue-400">Forge</span> Pro</h1>
                <p class="text-[10px] text-slate-400">Native Vector Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center bg-slate-800 rounded border border-slate-700">
                <button onclick="adjustZoom(-0.1)" class="px-2 py-1 hover:bg-slate-700 text-slate-300"><svg
                        xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                    </svg></button>
                <span id="zoomLevel" class="text-[10px] font-mono w-10 text-center text-slate-300">80%</span>
                <button onclick="adjustZoom(0.1)" class="px-2 py-1 hover:bg-slate-700 text-slate-300"><svg
                        xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg></button>
            </div>
            <button onclick="printDocument()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs font-medium transition-colors flex items-center gap-2 shadow-lg shadow-blue-900/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Export PDF
            </button>
        </div>
    </header>
    <main class="flex-1 flex overflow-hidden">
        <aside class="w-1/3 min-w-[320px] bg-slate-900 border-r border-slate-700 flex flex-col z-10 shadow-xl">
            <div class="flex border-b border-slate-700">
                <button onclick="switchTab('code')" id="tab-code"
                    class="flex-1 py-2 text-[11px] font-medium text-blue-400 border-b-2 border-blue-500 bg-slate-800">Source
                    Code</button>
                <button onclick="switchTab('config')" id="tab-config"
                    class="flex-1 py-2 text-[11px] font-medium text-slate-400 hover:text-white">Settings</button>
            </div>
            <div id="panel-code" class="flex-1 flex flex-col">
                <div
                    class="px-3 py-1 bg-slate-950 text-[10px] text-slate-400 border-b border-slate-800 flex justify-between items-center">
                    <span>HTML Input</span>
                    <button onclick="loadMegaTest()" class="text-blue-400 hover:underline cursor-pointer">Load Ultimate
                        Test</button>
                </div>
                <textarea id="htmlInput" class="editor-area flex-1 p-3" spellcheck="false"></textarea>
            </div>
            <div id="panel-config" class="flex-1 p-4 overflow-y-auto hidden space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Page Size</label>
                    <select id="pageSize" class="w-full rounded p-1.5 text-xs">
                        <option value="A4">A4 (210 x 297 mm)</option>
                        <option value="Letter">Letter</option>
                        <option value="Legal">Legal</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-[10px] text-slate-400">Top (mm)</label><input type="number"
                            id="marginTop" value="15" class="w-full rounded p-1 text-xs"></div>
                    <div><label class="block text-[10px] text-slate-400">Bottom (mm)</label><input type="number"
                            id="marginBottom" value="15" class="w-full rounded p-1 text-xs"></div>
                    <div><label class="block text-[10px] text-slate-400">Left (mm)</label><input type="number"
                            id="marginLeft" value="15" class="w-full rounded p-1 text-xs"></div>
                    <div><label class="block text-[10px] text-slate-400">Right (mm)</label><input type="number"
                            id="marginRight" value="15" class="w-full rounded p-1 text-xs"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Typography</label>
                    <input type="text" id="fontFamily" value="'Times New Roman', serif"
                        class="w-full rounded p-1.5 text-xs mb-1">
                    <div class="flex gap-2">
                        <input type="number" id="fontSize" value="11" class="w-full rounded p-1 text-xs">
                        <span class="text-xs self-center text-slate-500">pt</span>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Print Headers</label>
                    <input type="text" id="headerText" placeholder="Top center text..."
                        class="w-full rounded p-1.5 text-xs mb-2">
                    <input type="text" id="footerText" value="Confidential - [page]"
                        class="w-full rounded p-1.5 text-xs">
                </div>
                <div class="bg-slate-800 p-2 rounded border border-slate-700">
                    <p class="text-[10px] text-yellow-400">
                        <strong>Tip:</strong> In the print dialog, uncheck "Headers and footers" to remove the browser's
                        default Date/URL.
                    </p>
                </div>
                <button onclick="updatePreview(true)"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded text-xs font-medium">Apply
                    Settings</button>
            </div>
        </aside>
        <section class="flex-1 preview-container bg-slate-800">
            <iframe id="previewFrame" class="a4-page border-0"></iframe>
        </section>
    </main>
    <div id="toast" class="toast">Action Complete</div>
    <script>
        const state = { zoom: 0.8, timer: null };
        const els = {
            htmlInput: document.getElementById('htmlInput'),
            previewFrame: document.getElementById('previewFrame'),
            zoomLevel: document.getElementById('zoomLevel'),
            toast: document.getElementById('toast'),
            tabs: { code: document.getElementById('tab-code'), config: document.getElementById('tab-config') },
            panels: { code: document.getElementById('panel-code'), config: document.getElementById('panel-config') },
            settings: {
                pageSize: document.getElementById('pageSize'),
                marginTop: document.getElementById('marginTop'),
                marginBottom: document.getElementById('marginBottom'),
                marginLeft: document.getElementById('marginLeft'),
                marginRight: document.getElementById('marginRight'),
                fontFamily: document.getElementById('fontFamily'),
                fontSize: document.getElementById('fontSize'),
                headerText: document.getElementById('headerText'),
                footerText: document.getElementById('footerText'),
            }
        };

        window.onload = () => {
            loadMegaTest();
            els.htmlInput.addEventListener('input', () => {
                clearTimeout(state.timer);
                state.timer = setTimeout(() => updatePreview(), 500);
            });
            Object.values(els.settings).forEach(input => input.addEventListener('change', () => updatePreview()));
        };

        function switchTab(tab) {
            els.tabs.code.className = tab === 'code' ? 'flex-1 py-2 text-[11px] font-medium text-blue-400 border-b-2 border-blue-500 bg-slate-800' : 'flex-1 py-2 text-[11px] font-medium text-slate-400 hover:text-white';
            els.tabs.config.className = tab === 'config' ? 'flex-1 py-2 text-[11px] font-medium text-blue-400 border-b-2 border-blue-500 bg-slate-800' : 'flex-1 py-2 text-[11px] font-medium text-slate-400 hover:text-white';
            els.panels.code.classList.toggle('hidden', tab !== 'code');
            els.panels.config.classList.toggle('hidden', tab !== 'config');
        }

        function loadMegaTest() {
            const template = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Times New Roman', serif; line-height: 1.4; font-size: 11pt; color: #111; }
    h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #000; padding-bottom: 10px; }
    h2 { background-color: #eee; padding: 5px; border-left: 5px solid #000; margin-top: 20px; page-break-after: avoid; }
    h3 { border-bottom: 1px solid #ccc; }
    
    table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 10pt; }
    th { background-color: #333; color: white; padding: 8px; text-align: left; }
    td { border: 1px solid #ddd; padding: 8px; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .page-break { page-break-after: always; }
    .no-break { page-break-inside: avoid; }
    
    .chart-container { border: 1px solid #ccc; padding: 10px; margin: 20px 0; height: 200px; display: flex; align-items: flex-end; justify-content: space-around; }
    .bar { width: 40px; background-color: #4a90e2; text-align: center; color: white; font-size: 10pt; position: relative; }
    .bar span { position: absolute; bottom: -20px; left: 0; right: 0; color: black; font-size: 8pt; }

    .col-2 { column-count: 2; column-gap: 20px; text-align: justify; }
</style>
</head>
<body>

    <h1>Annual Financial Report</h1>
    <p style="text-align: center;">Fiscal Year 2024</p>
    <p><strong>Company:</strong> Acme Corp Global Industries<br><strong>Date:</strong> October 27, 2023</p>
    
    <div class="page-break"></div>

    <h2>1. Executive Summary</h2>
    <p>This document outlines the financial performance and strategic outlook for Acme Corp for the fiscal year 2024. All figures are audited and comply with international accounting standards.</p>
    
    <h3>1.1 Key Highlights</h3>
    <ul>
        <li>Revenue increased by 15% year-over-year.</li>
        <li>Operating margin expanded to 22%.</li>
        <li>Successful launch of the "Project Alpha" initiative.</li>
        <li>Expansion into three new international markets.</li>
    </ul>

    <h2>2. Financial Performance (Charts)</h2>
    <div class="chart-container">
        <div class="bar" style="height: 40%;">Q1<br><span>40%</span></div>
        <div class="bar" style="height: 55%;">Q2<br><span>55%</span></div>
        <div class="bar" style="height: 75%;">Q3<br><span>75%</span></div>
        <div class="bar" style="height: 95%; background-color: #27ae60;">Q4<br><span>95%</span></div>
    </div>
    <p style="font-size: 9pt; text-align: center;">Figure 1: Quarterly Revenue Growth</p>

    <div class="page-break"></div>

    <h2>3. Detailed Data Tables</h2>
    <p>The following table breaks down revenue by region. Note that this table is designed to span multiple pages to test pagination integrity.</p>
    
    <table>
        <thead>
            <tr>
                <th>Region ID</th>
                <th>Region Name</th>
                <th>Manager</th>
                <th>Q1 Revenue ($M)</th>
                <th>Q2 Revenue ($M)</th>
                <th>Q3 Revenue ($M)</th>
                <th>Q4 Revenue ($M)</th>
                <th>Total ($M)</th>
                <th>Growth %</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>001</td><td>North America</td><td>J. Doe</td><td>12.5</td><td>13.2</td><td>14.1</td><td>15.0</td><td>54.8</td><td>+12%</td></tr>
            <tr><td>002</td><td>Europe</td><td>A. Smith</td><td>10.2</td><td>10.8</td><td>11.5</td><td>12.1</td><td>44.6</td><td>+8%</td></tr>
            <tr><td>003</td><td>Asia Pacific</td><td>K. Tanaka</td><td>8.5</td><td>9.2</td><td>10.0</td><td>11.2</td><td>38.9</td><td>+18%</td></tr>
            <tr><td>004</td><td>Latin America</td><td>C. Silva</td><td>5.5</td><td>5.8</td><td>6.2</td><td>6.9</td><td>24.4</td><td>+15%</td></tr>
            <tr><td>005</td><td>Middle East</td><td>F. Al-Fayed</td><td>3.2</td><td>3.5</td><td>3.8</td><td>4.2</td><td>14.7</td><td>+20%</td></tr>
            <tr><td>006</td><td>Africa</td><td>N. Mandela</td><td>2.1</td><td>2.3</td><td>2.5</td><td>2.8</td><td>9.7</td><td>+10%</td></tr>
            <tr><td>007</td><td>Oceania</td><td>S. Hogan</td><td>1.8</td><td>1.9</td><td>2.1</td><td>2.4</td><td>8.2</td><td>+12%</td></tr>
            <tr><td>008</td><td>Virtual Sales</td><td>E. Musk</td><td>15.0</td><td>18.0</td><td>22.0</td><td>25.0</td><td>80.0</td><td>+30%</td></tr>
        </tbody>
    </table>

    <div class="page-break"></div>

    <h2>4. Legal & Compliance (Multi-Column Test)</h2>
    <div class="col-2">
        <h3>4.1 Terms of Service</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>
        <p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p>
        
        <h3>4.2 Privacy Policy</h3>
        <p>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt. Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.</p>
        <p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p>
    </div>

    <div style="margin-top: 50px; border-top: 1px solid #000; padding-top: 10px; text-align: center; font-size: 9pt;">
        <strong>CONFIDENTIAL DOCUMENT</strong><br>
        This document is intended solely for the use of the individual or entity to whom it is addressed and may contain information that is privileged, confidential and exempt from disclosure under applicable law.
    </div>
</body>
</html>`;
            els.htmlInput.value = template;
            updatePreview();
            showToast("Ultimate Test Loaded");
        }

        function updatePreview(msg) {
            const html = els.htmlInput.value;
            const doc = els.previewFrame.contentDocument || els.previewFrame.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();

            const head = doc.head;
            const style = doc.createElement('style');
            style.innerHTML = `
                html, body { margin: 0; padding: 0; height: 100%; }
                body { 
                    padding: ${els.settings.marginTop.value}mm ${els.settings.marginRight.value}mm ${els.settings.marginBottom.value}mm ${els.settings.marginLeft.value}mm !important;
                    box-sizing: border-box !important;
                    font-family: ${els.settings.fontFamily.value} !important;
                    font-size: ${els.settings.fontSize.value}pt !important;
                    background: white;
                    color: black;
                }
            `;
            head.appendChild(style);
            if (msg) showToast("Preview Updated");
        }

        function adjustZoom(delta) {
            state.zoom = Math.max(0.5, Math.min(1.2, state.zoom + delta));
            els.zoomLevel.textContent = Math.round(state.zoom * 100) + '%';
            els.previewFrame.style.transform = `scale(${state.zoom})`;
        }

        function printDocument() {
            const html = els.htmlInput.value;
            const printWindow = window.open('', '_blank');

            if (!printWindow) {
                alert("Please allow popups to export the PDF.");
                return;
            }

            const aggressivePrintCSS = `
                <style>
                    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; }
                    html, body { width: 100% !important; height: auto !important; overflow: visible !important; margin: 0 !important; }
                    
                    @page {
                        size: ${els.settings.pageSize.value};
                        margin-top: ${els.settings.marginTop.value}mm;
                        margin-bottom: ${els.settings.marginBottom.value}mm;
                        margin-left: ${els.settings.marginLeft.value}mm;
                        margin-right: ${els.settings.marginRight.value}mm;
                    }

                    body {
                        font-family: ${els.settings.fontFamily.value} !important;
                        font-size: ${els.settings.fontSize.value}pt !important;
                        line-height: 1.4;
                        color: #000;
                        background: #fff;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                    }

                    h1, h2, h3, h4, h5, h6 { break-after: avoid; page-break-after: avoid; break-inside: avoid; page-break-inside: avoid; }
                    table, thead, tbody, tfoot, tr, td, th, img, svg, pre, blockquote { break-inside: avoid; page-break-inside: avoid; }
                    tr { page-break-after: auto; page-break-before: auto; }
                    p, ul, ol, li { orphans: 3; widows: 3; }
                    
                    @top-center { content: "${els.settings.headerText.value}"; font-family: sans-serif; font-size: 9pt; color: #555; }
                    @bottom-center { content: "${els.settings.footerText.value}"; font-family: sans-serif; font-size: 9pt; color: #555; }
                </style>
            `;

            const finalHtml = html.replace('</head>', aggressivePrintCSS + '</head>');

            printWindow.document.open();
            printWindow.document.write(finalHtml);
            printWindow.document.close();

            setTimeout(() => {
                printWindow.focus();
                printWindow.print();
            }, 500);
            showToast("Opening Print Dialog...");
        }

        function showToast(msg) {
            els.toast.textContent = msg;
            els.toast.className = "toast show";
            setTimeout(() => els.toast.className = els.toast.className.replace("show", ""), 3000);
        }
    </script>
</body>

</html>
